<div class="card" [appHighlight]="'#fff9c4'" [ngClass]="cardClasses" [ngStyle]="{'border-left-color': course.gradeStatus === 'passed' ? 'green' : (course.gradeStatus === 'failed' ? 'red' : 'grey')}">
  <h3>{{ course.name }}</h3>
  <p><strong>Code:</strong> {{ course.code }}</p>
  <p><strong>Credits:</strong> {{ course.credits | creditLabel }}</p>
  <span [ngSwitch]="course.gradeStatus">
    <span *ngSwitchCase="'passed'" class="badge badge-passed">Passed</span>
    <span *ngSwitchCase="'failed'" class="badge badge-failed">Failed</span>
    <span *ngSwitchDefault class="badge badge-pending">Pending</span>
  </span>
  <div style="margin-top: 10px;">
    <button (click)="onEnroll()">Enroll</button>
    <button (click)="toggleExpand()">{{ isExpanded ? 'Hide Details' : 'Show Details' }}</button>
  </div>
</div>
