<h1>{{ portalName }}</h1>
<p>Welcome to the Student Course Portal for managing your academic journey.</p>
<div class="stats">
  <span>Courses Available: 12</span> | 
  <span>Enrolled: 3</span> | 
  <span>GPA: 3.8</span>
</div>
<div class="actions" style="margin-top: 15px;">
  <button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
  <p *ngIf="message">{{ message }}</p>
</div>
<div style="margin-top: 15px;">
  <input [(ngModel)]="searchTerm" placeholder="Search courses...">
  <p>Searching for: {{ searchTerm }}</p>
</div>
