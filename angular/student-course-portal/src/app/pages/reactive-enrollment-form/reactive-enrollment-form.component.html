<h2>Reactive Enrollment Form</h2>

<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
  <div>
    <label>Student Name:</label>
    <input formControlName="studentName">
    <span *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['required']" class="error">Name is required.</span>
  </div>

  <div>
    <label>Student Email:</label>
    <input formControlName="studentEmail">
    <span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']" class="error">Email taken</span>
  </div>

  <div>
    <label>Course ID:</label>
    <input formControlName="courseId">
    <span *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']" class="error">Course code starting with XX is not allowed.</span>
  </div>

  <div>
    <label>Preferred Semester:</label>
    <select formControlName="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div>
    <label>
      <input type="checkbox" formControlName="agreeToTerms"> Agree to terms
    </label>
  </div>

  <div style="margin-top: 15px;">
    <h3>Additional Courses</h3>
    <button type="button" (click)="addCourse()">Add Another Course</button>
    <div *ngFor="let ctrl of additionalCourses.controls; let i=index" style="margin-top: 5px;">
      <input [formControl]="$any(ctrl)">
      <button type="button" (click)="removeCourse(i)">Remove</button>
    </div>
  </div>

  <button type="submit" [disabled]="enrollForm.invalid" style="margin-top: 15px;">Submit</button>
</form>
